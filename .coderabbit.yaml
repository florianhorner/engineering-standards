# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# BEGIN: engineering-standards-coderabbit
#
# Durable CodeRabbit auto-review settings.
# Reference only: bootstrap-repo.sh neither installs nor refreshes this file;
# templates/README.md describes the separate installation procedure. The
# markers are a provenance stamp, not a section boundary.
#
# This yaml is the durable copy. CodeRabbit organization settings live in
# its web UI, not here. After adding this file to a repository, set them to
# match (incrementals off, Dependabot ignored) so included reviews are not
# spent on every push.
#
# Do not turn auto-review fully off. First reviews on open/ready must keep
# happening without the leftover dispatcher. Do not add a label-only gate
# here: that would starve first reviews until someone triggers them.
#
# Keys: https://docs.coderabbit.ai/configuration/auto-review
#
reviews:
  auto_review:
    enabled: true
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 1
    drafts: false
    ignore_usernames:
      - dependabot[bot]
      - renovate[bot]
      - github-actions[bot]
      - pre-commit-ci[bot]
# END: engineering-standards-coderabbit
