# REFERENCE ONLY — bootstrap-repo.sh neither installs nor refreshes this file.
#
# It shows the shape of a Dependabot config that lists each tracked package
# tree explicitly, because a config in which every block says `directory: "/"`
# silently skips every package tree outside root. This example covers a repo
# with a root and a server/ npm tree, a Dockerfile under ha-addon/, and a
# composite action.
#
# Rules this example follows:
#   - one block per ecosystem, listing directories explicitly. Two blocks for
#     the same ecosystem must not overlap, and globbing in `directories` is
#     documented but broken (dependabot/dependabot-core#12348).
#   - `commit-message.prefix: "chore"` on every block. This is the load-bearing
#     part: Dependabot's default subject "Bump foo from 1 to 2" fails the format
#     rule.
#   - a `groups` entry once a block covers more than one directory, since
#     open-pull-requests-limit is not reliably enforced across directories
#     (dependabot/dependabot-core#10395).
#
# Spec reference: https://github.com/florianhorner/engineering-standards/blob/main/specs/commit-message-spec.md#bot-allowlist
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/ha-app-docs-lint"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      npm-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/ha-addon/mammamiradio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
