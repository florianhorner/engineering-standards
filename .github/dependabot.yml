# BEGIN: commit-message-standards
# Generated by bootstrap-repo.sh from the manifests this repo tracks.
# Re-run the bootstrap to refresh after adding or removing a package tree;
# do not hand-edit between the markers. Blocks outside the markers are kept.
#
# The `commit-message.prefix: "chore"` line is the load-bearing part —
# Dependabot's default subject "Bump foo from 1 to 2" fails the format rule
# per Eng E8. Everything else is sensible defaults.
#
# Spec reference: https://github.com/florianhorner/engineering-standards/blob/main/specs/commit-message-spec.md#bot-allowlist
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/ha-app-docs-lint"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
# END: commit-message-standards
