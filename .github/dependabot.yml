# BEGIN: commit-message-standards
# Lists each package tree this repository tracks. bootstrap-repo.sh does not
# generate or refresh this file; update it by hand when a package tree is
# added or removed. templates/dependabot-snippet.yml shows the same shape.
#
# The `commit-message.prefix: "chore"` line is the load-bearing part —
# Dependabot's default subject "Bump foo from 1 to 2" fails the format rule.
# Everything else is sensible defaults.
#
# Spec reference: https://github.com/florianhorner/engineering-standards/blob/main/specs/commit-message-spec.md#bot-allowlist
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/ha-app-docs-lint"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
# END: commit-message-standards
