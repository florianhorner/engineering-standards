# commit-lint-reusable.yml
#
# Called by consumer repositories at an immutable commit SHA. The called
# workflow revision is the only executable policy source: consumer policy and
# commitlint files are untrusted data and are never executed.

name: commit-lint-reusable

on:
  workflow_call:
    outputs:
      workflow_repository:
        description: Exact repository that supplied this reusable workflow
        value: ${{ jobs.validate.outputs.workflow_repository }}
      workflow_ref:
        description: Exact repository, workflow path, and revision
        value: ${{ jobs.validate.outputs.workflow_ref }}
      workflow_sha:
        description: Exact revision that supplied this reusable workflow
        value: ${{ jobs.validate.outputs.workflow_sha }}

permissions: {}

jobs:
  validate:
    name: validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      workflow_repository: ${{ steps.identity.outputs.workflow_repository }}
      workflow_ref: ${{ steps.identity.outputs.workflow_ref }}
      workflow_sha: ${{ steps.identity.outputs.workflow_sha }}
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Verify immutable workflow identity
        id: identity
        env:
          EXPECTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          EXPECTED_WORKFLOW_REF: ${{ job.workflow_ref }}
          EXPECTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail

          if [ -z "$EXPECTED_WORKFLOW_REPOSITORY" ] \
            || [ -z "$EXPECTED_WORKFLOW_REF" ] \
            || [ -z "$EXPECTED_WORKFLOW_SHA" ]; then
            echo "::error::Reusable-workflow identity context is empty."
            exit 2
          fi
          if ! printf '%s\n' "$EXPECTED_WORKFLOW_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::Invalid reusable-workflow repository identity."
            exit 2
          fi
          if ! printf '%s\n' "$EXPECTED_WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Reusable-workflow SHA is not an immutable 40-hex revision."
            exit 2
          fi

          REQUIRED_WORKFLOW_REF="${EXPECTED_WORKFLOW_REPOSITORY}/.github/workflows/commit-lint-reusable.yml@${EXPECTED_WORKFLOW_SHA}"
          if [ "$EXPECTED_WORKFLOW_REF" != "$REQUIRED_WORKFLOW_REF" ]; then
            echo "::error::Reusable workflow must be called with its exact 40-hex SHA."
            exit 2
          fi

          ACTUAL_SHA="$(git -C trusted rev-parse HEAD)"
          ACTUAL_ORIGIN="$(git -C trusted remote get-url origin)"
          ACTUAL_REPOSITORY="${ACTUAL_ORIGIN#https://github.com/}"
          ACTUAL_REPOSITORY="${ACTUAL_REPOSITORY#git@github.com:}"
          ACTUAL_REPOSITORY="${ACTUAL_REPOSITORY%.git}"

          if [ "$ACTUAL_REPOSITORY" != "$EXPECTED_WORKFLOW_REPOSITORY" ]; then
            echo "::error::Reusable-workflow checkout origin mismatch."
            exit 2
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_WORKFLOW_SHA" ]; then
            echo "::error::Reusable-workflow checkout SHA mismatch."
            exit 2
          fi

          {
            echo "workflow_repository=$EXPECTED_WORKFLOW_REPOSITORY"
            echo "workflow_ref=$EXPECTED_WORKFLOW_REF"
            echo "workflow_sha=$EXPECTED_WORKFLOW_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Immutable workflow identity"
            echo ""
            echo "- Repository: \`$EXPECTED_WORKFLOW_REPOSITORY\`"
            echo "- Reference: \`$EXPECTED_WORKFLOW_REF\`"
            echo "- Revision: \`$EXPECTED_WORKFLOW_SHA\`"
            echo "- Runner image: \`${ImageOS:-unknown} ${ImageVersion:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'

      - name: Install locked commitlint toolchain
        working-directory: trusted
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify policy inputs
        run: |
          set -euo pipefail
          if [ ! -f "consumer/.config/commit-rules.json" ]; then
            echo "::error::Missing consumer policy metadata at .config/commit-rules.json."
            exit 2
          fi
          test -f trusted/specs/commit-rules.json
          test -f trusted/.commitlintrc.json
          test -f trusted/package-lock.json

      - name: Create isolated scratch directory
        id: scratch
        run: |
          set -euo pipefail
          SCRATCH_DIR="$(mktemp -d "${RUNNER_TEMP}/commit-policy.XXXXXX")"
          chmod 700 "$SCRATCH_DIR"
          echo "path=$SCRATCH_DIR" >> "$GITHUB_OUTPUT"

      - name: Compute immutable commit range
        id: range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        working-directory: consumer
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -n "$PR_HEAD_SHA" ]; then
            if ! printf '%s\n' "$PR_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$' \
              || ! git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null \
              || ! git merge-base --is-ancestor "$PR_HEAD_SHA" "$HEAD_SHA"; then
              echo "::error::Pull-request head is absent from the immutable merge checkout."
              exit 2
            fi
          fi
          if [ -n "$PR_BASE_SHA" ]; then
            RANGE_BASE="$PR_BASE_SHA"
          elif printf '%s\n' "$PUSH_BEFORE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE_BASE="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            RANGE_BASE="$(git rev-parse HEAD^)"
          else
            RANGE_BASE="$HEAD_SHA"
          fi

          if ! git cat-file -e "${RANGE_BASE}^{commit}" 2>/dev/null; then
            echo "::error::Immutable range base is not present in the checkout."
            exit 2
          fi

          MERGE_BASE="$(git merge-base "$RANGE_BASE" "$HEAD_SHA")"
          RANGE_SHAS="$(git rev-list --no-merges "${MERGE_BASE}..${HEAD_SHA}")"
          COUNT="$(printf '%s\n' "$RANGE_SHAS" | grep -cv '^$' || true)"
          {
            echo "merge_base=$MERGE_BASE"
            echo "count=$COUNT"
            echo "shas<<EOF_RANGE"
            echo "$RANGE_SHAS"
            echo "EOF_RANGE"
          } >> "$GITHUB_OUTPUT"
          echo "Validating $COUNT commits in range ${MERGE_BASE}..${HEAD_SHA}"

      - name: Generate validator from immutable policy
        env:
          SCRATCH_DIR: ${{ steps.scratch.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$SCRATCH_DIR/messages" "$SCRATCH_DIR/results"
          python3 -I trusted/validator/generate-hook.py > "$SCRATCH_DIR/commit-msg-hook"
          chmod +x "$SCRATCH_DIR/commit-msg-hook"

      - name: Validate custom policy
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RANGE_SHAS: ${{ steps.range.outputs.shas }}
          SCRATCH_DIR: ${{ steps.scratch.outputs.path }}
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
        working-directory: consumer
        run: |
          set -uo pipefail

          RULES_FILE="$TRUSTED_ROOT/specs/commit-rules.json"
          TRUSTED_BOTS="$(python3 -I -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["exemptions"]["trusted_bots"]))' "$RULES_FILE")"
          BOT_SKIPS="$(python3 -I -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["exemptions"]["trusted_bot_skips"]))' "$RULES_FILE")"

          is_trusted_bot() {
            [ -n "${1:-}" ] && printf '%s\n' "$TRUSTED_BOTS" | grep -qxF -- "$1"
          }

          all_blocks_skippable() {
            result_file="$1"
            # shellcheck disable=SC2016
            ids="$(awk '/^BLOCK: / {print $2}' "$result_file")"
            [ -n "$ids" ] || return 1
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              printf '%s\n' "$BOT_SKIPS" | grep -qxF -- "$id" || return 1
            done <<EOF_IDS
          $ids
          EOF_IDS
          }

          record_failure() {
            ref="$1"
            result_file="$2"
            # shellcheck disable=SC2016
            ids="$(awk '/^BLOCK: / {printf "%s%s", separator, $2; separator=","}' "$result_file")"
            [ -n "$ids" ] || ids="UNKNOWN"
            printf '| %s | %s |\n' "$ref" "$ids" >> "$SCRATCH_DIR/failures.md"
          }

          FAIL_COUNT=0
          : > "$SCRATCH_DIR/failures.md"

          if [ -n "$PR_TITLE" ]; then
            printf '%s\n' "$PR_TITLE" > "$SCRATCH_DIR/messages/__pr_title__.txt"
            if ! timeout 30s "$SCRATCH_DIR/commit-msg-hook" \
              "$SCRATCH_DIR/messages/__pr_title__.txt" \
              2> "$SCRATCH_DIR/results/__pr_title__.err"; then
              if is_trusted_bot "$PR_AUTHOR" \
                && all_blocks_skippable "$SCRATCH_DIR/results/__pr_title__.err"; then
                echo "PR title violations are skippable for the configured bot."
              else
                FAIL_COUNT=$((FAIL_COUNT + 1))
                record_failure "PR title" "$SCRATCH_DIR/results/__pr_title__.err"
              fi
            fi
          fi

          while IFS= read -r SHA; do
            [ -z "$SHA" ] && continue
            git log -1 --format=%B "$SHA" > "$SCRATCH_DIR/messages/${SHA}.txt"
            if ! timeout 30s "$SCRATCH_DIR/commit-msg-hook" \
              "$SCRATCH_DIR/messages/${SHA}.txt" \
              2> "$SCRATCH_DIR/results/${SHA}.err"; then
              FAIL_COUNT=$((FAIL_COUNT + 1))
              record_failure "${SHA:0:12}" "$SCRATCH_DIR/results/${SHA}.err"
            fi
          done <<EOF_SHAS
          $RANGE_SHAS
          EOF_SHAS

          echo "fail_count=$FAIL_COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "## Commit policy results"
            echo ""
            echo "Validated **${{ steps.range.outputs.count }} commits** plus the PR title when present."
            echo ""
            if [ "$FAIL_COUNT" -eq 0 ]; then
              echo ":white_check_mark: Custom policy passed."
            else
              echo ":x: **$FAIL_COUNT policy failures.**"
              echo ""
              echo "| ref | rule IDs |"
              echo "|---|---|"
              cat "$SCRATCH_DIR/failures.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run trusted commitlint authority
        id: commitlint
        if: steps.range.outputs.count != '0'
        continue-on-error: true
        working-directory: consumer
        run: |
          set +e
          set -o pipefail
          node ../trusted/node_modules/@commitlint/cli/cli.js \
            --config ../trusted/.commitlintrc.json \
            --from '${{ steps.range.outputs.merge_base }}' \
            --to HEAD \
            --verbose \
            2>&1 \
            | python3 -I ../trusted/validator/sanitize_output.py -
          PIPE_STATUSES=("${PIPESTATUS[@]}")
          set -e
          if [ "${PIPE_STATUSES[1]}" -ne 0 ]; then
            echo "::error::Commitlint output sanitizer failed."
            exit 2
          fi
          exit "${PIPE_STATUSES[0]}"

      - name: Fail on policy violations
        if: steps.validate.outputs.fail_count != '0' || steps.commitlint.outcome == 'failure'
        env:
          CUSTOM_FAILURES: ${{ steps.validate.outputs.fail_count }}
          COMMITLINT_OUTCOME: ${{ steps.commitlint.outcome }}
        run: |
          echo "::error::Commit policy failed (custom=$CUSTOM_FAILURES, commitlint=$COMMITLINT_OUTCOME)."
          exit 1
