# Monthly fleet-wide commit-message-standards compliance report.
#
# Why this exists (and why it's a GitHub Actions workflow, not a Claude Code
# cloud routine): cloud routines run in an isolated sandbox with no access to
# Florian's local filesystem, so they can't walk ~/repos or
# ~/conductor/workspaces the way the local fleet-audit.sh does. This workflow
# instead enumerates GitHub repos via `gh repo list`, which catches repos that
# were never cloned to this machine. That does NOT make it the more complete
# read: it reports public repos only, because the report lands in a public
# issue and an Actions summary, so a repo absent from the table may be
# private, unlisted or past the 200 cap. `fleet-audit-remote.sh` carries the
# same caveat, and so does the report footer.
#
# This workflow is REPORT-ONLY. It never calls bootstrap-repo.sh and never
# writes to any other repo. It only reads via the GitHub API and, at the end,
# opens/updates ONE issue in this repo so the report is genuinely visible
# (an issue notification), not just buried in the job summary. The JSON
# artifact uploaded below is the machine-readable half of the same report.
name: Fleet Audit (Monthly)

on:
  schedule:
    # 08:07 UTC on the 1st of each month. Deliberately not a `:00` boundary —
    # avoids the exact-hour stampede convention already used elsewhere in
    # this ecosystem's scheduled workflows.
    - cron: "7 8 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  fleet-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run fleet-wide compliance audit and file report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash fleet-audit-remote.sh --github-issue --json fleet-audit.json

      # The remediation phase reads THIS artifact, never the issue thread.
      # Issue comments are writable by anyone who can comment on the repo; a
      # run artifact is written only by this workflow and is immutable once
      # the run completes. That difference is the whole reason the artifact
      # exists — see the header note in fleet-audit-remote.sh.
      - name: Upload machine-readable report
        uses: actions/upload-artifact@v4
        with:
          name: fleet-audit-report
          path: fleet-audit.json
          retention-days: 90
          if-no-files-found: error
